@if (sidebarState.isOpen()) {
  <div class="sidebar-overlay" (click)="close()"></div>
}
<aside
  class="sidebar"
  [class.sidebar--open]="sidebarState.isOpen()"
>

  <!-- =========================================
       PERFIL
       ========================================= -->

  <div class="profile-area">

    <img
      [src]="perfil.fotoUrl"
      [alt]="perfil.nome"
      class="profile-img"
    >

    <span class="profile-faca">
      {{ perfil.nome }}
    </span>

  </div>


  <!-- =========================================
       USUÁRIO
       ========================================= -->

  <div class="user-info">
    <span>
      Olá, {{ user()?.login }}
    </span>
  </div>


  <!-- =========================================
       NAVEGAÇÃO
       ========================================= -->

  <nav class="nav flex-column">

    <!-- BARBEARIA -->

    @if (userState.isBarbershop()) {

      <a
        class="nav-link"
        routerLink="/barbershop"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <i class="bi bi-house-door"></i>
        <span>Home</span>
      </a>

      <a
        class="nav-link"
        routerLink="/Agendamentos"
        routerLinkActive="active"
      >
        <i class="bi bi-journal"></i>
        <span>Agendamentos</span>
      </a>

      <a
        class="nav-link"
        routerLink="/Clientes"
        routerLinkActive="active"
      >
        <i class="bi bi-people"></i>
        <span>Clientes</span>
      </a>

      <a
        class="nav-link"
        routerLink="/Barbeiros"
        routerLinkActive="active"
      >
        <i class="bi bi-person"></i>
        <span>Barbeiros</span>
      </a>

      <a
        class="nav-link"
        routerLink="/services"
        routerLinkActive="active"
      >
        <i class="bi bi-rulers"></i>
        <span>Serviços</span>
      </a>

      <a
        class="nav-link"
        routerLink="/Financeiro"
        routerLinkActive="active"
      >
        <i class="bi bi-coin"></i>
        <span>Financeiro</span>
      </a>

      <a
        class="nav-link"
        routerLink="/Relatórios"
        routerLinkActive="active"
      >
        <i class="bi bi-bar-chart"></i>
        <span>Relatórios</span>
      </a>

      <a
        class="nav-link"
        routerLink="/Configurações"
        routerLinkActive="active"
      >
        <i class="bi bi-gear"></i>
        <span>Configurações</span>
      </a>

      <a
        class="nav-link text-danger"
        routerLink="/logout"
      >
        <i class="bi bi-box-arrow-right"></i>
        <span>Sair</span>
      </a>

    }


    <!-- CLIENTE -->

    @if (userState.isClient()) {

      <a
        class="nav-link"
        routerLink="/client"
        routerLinkActive="active"
      >
        <i class="bi bi-house-door"></i>
        <span>Dashboard</span>
      </a>

    }

  </nav>

</aside>
