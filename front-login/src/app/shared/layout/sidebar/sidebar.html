<aside class="sidebar">

  <div class="profile-area">
    <img [src]="perfil.fotoUrl" alt="" class="profile-img me-3">
  <span class="profile-faca">
    {{ perfil.nome }}
  </span>
  </div>

  <div class="user-info">
    <span>Olá, {{ user()?.login }} </span>
  </div>

  <nav class="nav flex-column">
    @if(userState.isBarbershop()) {
    <a class="nav-link" routerLink="/barbershop" routerLinkActive="active"><i class="bi bi-house-door"></i>Home</a>
    <a class="nav-link" routerLink="/Agendamentos" routerLinkActive="active"><i class="bi bi-journal"></i>
      Agendamentos</a>
    <a class="nav-link" routerLink="/Clientes" routerLinkActive="active"><i class="bi bi-people me-2"></i> Clientes</a>
    <a class="nav-link" routerLink="/Barbeiros" routerLinkActive="active"><i class="bi bi-person"></i> Barbeiros</a>
    <a class="nav-link" routerLink="/services" routerLinkActive="active"><i class="bi bi-rulers"></i> Serviços</a>
    <a class="nav-link" routerLink="/Financeiro" routerLinkActive="active"><i class="bi bi-coin"></i> Financeiro</a>
    <a class="nav-link" routerLink="/Relatórios" routerLinkActive="active"><i class="bi bi-bar-chart"></i>
      Relatórios</a>
    <a class="nav-link" routerLink="/Configurações" routerLinkActive="active"><i class="bi bi-gear"></i>
      Configurações</a>
    <a class="nav-link text-danger" routerLink="/logout">Sair</a>
    }

    @if(userState.isClient()) {
    <a class="nav-link" routerLink="/client" routerLinkActive="active">Dashboard</a>
    }
  </nav>
</aside>
